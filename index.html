<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCDT 로고 다운로드</title>
<style>
:root{--bg:#fff;--fg:#17151c;--muted:#6b6b6b;--line:#e2e2e2;--accent:#6b00ff;--navy:#001b54;--soft:#f6f6f7;
 --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{background:var(--accent);color:#fff;font-weight:700}
.bar{display:grid;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.row>label{font-size:12.5px;color:var(--muted);min-width:56px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px 5px 6px;font-size:13px}
.chip.t{padding:5px 14px}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.08)}
.chip[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg);font-weight:700}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.zip{margin-left:auto;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:8px 16px;font-weight:700}
.zip:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;padding-top:22px}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.pv{height:230px;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}
.pv.dk{background:var(--navy)}
.pv svg{width:100%;height:100%;display:block}
.pv.dk+.cap{border-top-color:var(--navy)}
.cap{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.cap .nm{flex:1;min-width:0}
.cap b{display:block;font-size:13.5px}
.cap small{color:var(--muted);font-size:12px}
.dl{border:1px solid var(--fg);background:#fff;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.dl:hover{background:var(--fg);color:#fff}
.dl:disabled{opacity:.5}
.gh{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--fg);padding-top:12px;margin-top:14px}
.gh.first{margin-top:0}
.gh b{font-size:15px}
.gh small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
h2{font-size:15px;margin:38px 0 14px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.col{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px}
.col .sw{height:64px;background:var(--c)}
.col div.t{padding:9px 12px;display:grid;gap:1px}
.col b{font-size:13px;margin-bottom:3px}
.col span{color:var(--muted);font-variant-numeric:tabular-nums}
footer{margin-top:40px;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;max-width:90vw;z-index:9}
#toast[hidden]{display:none}
@media (max-width:560px){.wrap{padding:20px 14px 60px}.grid{grid-template-columns:minmax(0,1fr)}.zip{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 data-i="h1"></h1>
  <span class="sub" data-i="sub"></span>
  <div class="seg" id="lang" role="group"><button type="button" data-l="ko">한</button><button type="button" data-l="en">EN</button></div>
</header>

<section class="bar">
  <div class="row"><label data-i="fType"></label><div class="chips" id="fType"></div></div>
  <div class="row"><label data-i="fColor"></label><div class="chips" id="fColor"></div></div>
  <div class="row">
    <label data-i="oFmt"></label>
    <div class="seg" id="oFmt" role="radiogroup"><button type="button" role="radio" data-v="svg">SVG</button><button type="button" role="radio" data-v="png">PNG</button><button type="button" role="radio" data-v="pdf">PDF</button></div>
    <span id="pngW"><label data-i="oW" style="margin-right:6px"></label>
      <span class="seg" id="oWs" role="radiogroup"><button type="button" role="radio" data-v="1000">1000</button><button type="button" role="radio" data-v="2000">2000</button><button type="button" role="radio" data-v="4000">4000</button></span></span>
    <label class="tog"><input type="checkbox" id="oClear"><span data-i="oClear"></span></label>
    <label class="tog"><input type="checkbox" id="oBg"><span data-i="oBg"></span></label>
    <button type="button" class="zip" id="zip"></button>
  </div>
</section>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden data-i="empty"></div>

<h2 data-i="hCol"></h2>
<div class="cols" id="cols"></div>
<footer data-i="foot"></footer>
</div>
<div id="toast" hidden></div>

<script src="lib/svg2pdf.umd.min.js"></script>

  const L=LOGOS[o.key],D=st.clear?L.D:0,w=L.w+2*D,h=L.h+2*D;
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=st.w;c.height=Math.round(st.w*h/w);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png')};
  img.onerror=()=>rej(new Error('png'));
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
})}
async function toPdf(o){
  if(!window.jspdf)throw new Error(t('libFail'));
  const s=svgOf(o,{clear:st.clear,bg:st.bg,size:1});
  const L=LOGOS[o.key],D=st.clear?L.D:0,w=L.w+2*D,h=L.h+2*D;
  const doc=new jspdf.jsPDF({unit:'pt',format:[w,h],orientation:w>=h?'landscape':'portrait',compress:true});
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0';host.innerHTML=s;document.body.appendChild(host);
  try{await doc.svg(host.firstElementChild,{x:0,y:0,width:w,height:h})}finally{host.remove()}
  return doc.output('blob');
}
async function make(o){
  if(st.fmt==='svg')return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+svgOf(o,{clear:st.clear,bg:st.bg,size:1})],{type:'image/svg+xml'});
  if(st.fmt==='png')return toPng(o);
  return toPdf(o);
}
async function one(o,btn){
  btn.disabled=true;
  try{await saveFile(fileBase(o)+'.'+st.fmt,await make(o))}catch(e){console.error(e);toast(t('fail')+(e.message?': '+e.message:''))}
  finally{btn.disabled=false}
}
async function zipAll(){
  if(!window.JSZip){toast(t('libFail'));return}
  const z=$('zip');z.disabled=true;const old=z.textContent;z.textContent=t('zipping');
  try{
    const zip=new JSZip();
    for(const o of shown())zip.file(fileBase(o)+'.'+st.fmt,await make(o));
    await saveFile('HCDT_logos_'+st.fmt+'.zip',await zip.generateAsync({type:'blob'}));
  }catch(e){console.error(e);toast(t('fail')+(e.message?': '+e.message:''))}
  finally{z.textContent=old;z.disabled=false;render()}
}

/* 색상 */
function renderCols(){
  const rows=[['#6B00FF','HCDT Purple',[107,0,255],[80,79,0,0]],...ACC.map(a=>[a[1],'HCDT '+a[3],a[4],a[5]])];
  let h=rows.map(r=>`<div class="col"><div class="sw" style="--c:${r[0]}"></div><div class="t"><b>${r[1]}</b><span>HEX ${r[0]}</span><span>RGB ${r[2].join(' / ')}</span><span>CMYK ${r[3].join(' / ')}</span></div></div>`);
  h.push(`<div class="col"><div class="sw" style="--c:${NAVY}"></div><div class="t"><b>UNIST Indigo</b><span>HEX ${NAVY}</span></div></div>`);
  $('cols').innerHTML=h.join('');
}
$('lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;render()});
$('oFmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.fmt=b.dataset.v;render()});
$('oWs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.w=+b.dataset.v;render()});
$('oClear').addEventListener('change',e=>{st.clear=e.target.checked;render()});
$('oBg').addEventListener('change',e=>{st.bg=e.target.checked;render()});
$('zip').addEventListener('click',zipAll);
renderCols();render();
</script>
